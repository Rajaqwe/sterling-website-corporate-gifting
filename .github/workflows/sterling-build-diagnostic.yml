name: Sterling Build Diagnostic

on:
  push:
    branches:
      - main

jobs:
  diagnostic:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Sync lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Commit lockfile sync
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already in sync"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile"
            git push
          fi

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Tailwind/PostCSS check
        run: npx tailwindcss -i ./src/app/globals.css -o /tmp/sterling-tailwind.css

      - name: Next build check
        run: npm run build
