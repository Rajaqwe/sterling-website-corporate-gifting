name: Sterling CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tailwind/PostCSS
        run: npx tailwindcss -i ./src/app/globals.css -o /tmp/sterling-tailwind.css

      - name: Production build
        run: npm run build
